# Railway/Nixpacks: install devDependencies (tsc, vite) for the client build,
# and all workspace packages for the monorepo layout.
[phases.install]
cmds = [
  "npm install --include=dev",
  "npm install --include=dev --prefix client",
  "npm install --include=dev --prefix server",
]

[phases.build]
cmds = [
  "npm run build --prefix client",
  "npm install --omit=dev --prefix server",
]

[start]
cmd = "npm start"